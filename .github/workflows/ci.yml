name: CI

on:
  push:
    branches: [main, lxy, codex/public-deployment]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !(github.repository == 'EthanLyu30/insong' && github.ref == 'refs/heads/main') }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    outputs:
      tree: ${{ steps.frontend-digest.outputs.tree }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          version: '11.19.0'
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm build:checked
        working-directory: frontend
      - id: frontend-digest
        run: echo "tree=$(python ops/hk/deploy_client.py digest)" >> "$GITHUB_OUTPUT"

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: insong_qa
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements-deploy.txt
        working-directory: backend
      - run: python tools/fetch_model.py --tokenizer-only
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
        env:
          APP_ENV: test
          TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/insong_qa?sslmode=disable
      - run: python -m pytest ops/hk/tests -q

  container:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: insong_qa
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install httpx Pillow
      - run: docker build --build-arg RELEASE_SHA="$GITHUB_SHA" -t "insong-backend:$GITHUB_SHA" -t insong-qa backend
      - name: Run within the documented Free CPU and RAM limits
        run: >-
          docker run -d --name insong-qa --network host --memory 512m --cpus 0.1
          -e APP_ENV=test -e DATABASE_SCHEMA=insong_container_smoke
          -e DATABASE_URL='postgresql://postgres:postgres@127.0.0.1:5432/insong_qa?sslmode=disable'
          insong-qa
      - run: python backend/tools/container_smoke.py
      - name: Check bundled database CA is readable by the runtime user
        run: >-
          docker exec insong-qa python -c "import ssl; context=ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT);
          context.load_verify_locations(cafile='/app/certs/prod-ca-2021.crt');
          assert context.cert_store_stats()['x509_ca'] == 1"
      - name: Report container memory and logs
        if: always()
        run: |
          docker stats --no-stream --format '{{.MemUsage}}' insong-qa || true
          docker inspect --format 'OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}}' insong-qa || true
          docker exec insong-qa cat /sys/fs/cgroup/memory.peak || true
          docker logs insong-qa || true
      - uses: actions/setup-node@v7
        if: github.repository == 'EthanLyu30/insong' && github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.HK_DEPLOY_ENABLED == 'true'
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        if: github.repository == 'EthanLyu30/insong' && github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.HK_DEPLOY_ENABLED == 'true'
        with:
          version: '11.19.0'
      - name: Publish the checked commit to Hong Kong
        if: github.repository == 'EthanLyu30/insong' && github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.HK_DEPLOY_ENABLED == 'true'
        env:
          HK_DEPLOY_ENABLED: 'true'
          HK_CI_COMPLETE: 'true'
          HK_HOST: ${{ secrets.HK_HOST }}
          HK_USER: ${{ secrets.HK_USER }}
          HK_SSH_PRIVATE_KEY: ${{ secrets.HK_SSH_PRIVATE_KEY }}
          HK_SSH_KNOWN_HOSTS: ${{ secrets.HK_SSH_KNOWN_HOSTS }}
          EXPECTED_FRONTEND: ${{ needs.frontend.outputs.tree }}
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build
          test "$(python ops/hk/deploy_client.py digest)" = "$EXPECTED_FRONTEND"
          docker save "insong-backend:$GITHUB_SHA" -o backend-image.tar
          python ops/hk/deploy_client.py bundle
          python ops/hk/deploy_client.py publish
