<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#151019" />
    <meta name="description" content="歌里有我：把一首歌和一段人生经历留在一起。" />
    <title>歌里有我</title>
    <script>
      const entry = new URLSearchParams(location.search);
      if (location.pathname === '/' && !['theme', 'event', 'choose'].some(key => entry.has(key))) {
        const image = document.createElement('link');
        image.rel = 'preload';
        image.setAttribute('as', 'image');
        image.href = '/collage-scene.webp';
        image.setAttribute('fetchpriority', 'high');
        document.head.appendChild(image);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
