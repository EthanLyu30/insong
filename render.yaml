services:
  - type: web
    name: insong-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SCHEMA
        value: insong
      - key: CORS_ORIGINS
        value: https://insong.me
      - key: DATABASE_SSLROOTCERT
        value: /app/certs/prod-ca-2021.crt
