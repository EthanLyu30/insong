services:
  - type: web
    name: insong-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    branch: main
    # Retained only as a frozen migration fallback; production runs in Hong Kong.
    autoDeployTrigger: off
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: MIGRATION_READ_ONLY
        value: '1'
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SCHEMA
        value: insong
      - key: CORS_ORIGINS
        value: https://insong.me,https://insong.vercel.app
      - key: DATABASE_SSLROOTCERT
        value: /app/certs/prod-ca-2021.crt
